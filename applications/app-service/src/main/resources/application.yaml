server:
  port: 8080
spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/autenticacion_db
    username: postgres
    password: admin123
  sql:
    init:
      mode: "always"
  application:
    name: "BootCamp-Auth-Service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
